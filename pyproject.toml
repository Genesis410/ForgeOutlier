[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeoutlier"
version = "1.0.0"
description = "Lightweight Open-Set Deepfake Detection Library & CLI with Tri-State Abstention (CPU-First, Offline-First)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "ForgeOutlier Contributors" }
]
keywords = [
    "deepfake-detection",
    "out-of-distribution",
    "mahalanobis",
    "tri-state",
    "computer-vision",
    "offline-first"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "opencv-python-headless>=4.7.0.72",
]

[project.optional-dependencies]
eval = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
forgeoutlier = "forgeoutlier.cli.commands:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeoutlier"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = []
